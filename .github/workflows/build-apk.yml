name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android source
        run: |
          rm -rf build-src
          mkdir -p build-src
          unzip -q AlfaProAccounting-alpha02-reviewed-source.zip -d build-src
          test -f build-src/AlfaProAccounting-reviewed-source/settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 36
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Show build environment
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Build debug APK
        working-directory: build-src/AlfaProAccounting-reviewed-source
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          test -f build-src/AlfaProAccounting-reviewed-source/app/build/outputs/apk/debug/app-debug.apk
          ls -lh build-src/AlfaProAccounting-reviewed-source/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlfaProAccounting-debug-apk
          path: build-src/AlfaProAccounting-reviewed-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

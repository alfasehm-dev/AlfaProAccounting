name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android source
        run: |
          rm -rf build-src
          mkdir -p build-src
          unzip -q AlfaProAccounting-alpha02-reviewed-source.zip -d build-src
          test -f build-src/AlfaProAccounting-reviewed-source/settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK manager
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        run: yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android SDK 36
        run: |
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          "$SDKMANAGER" --list_installed

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Pin AndroidX for API 36
        working-directory: build-src/AlfaProAccounting-reviewed-source
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          configurations.all {
              resolutionStrategy {
                  force("androidx.core:core:1.16.0")
                  force("androidx.core:core-ktx:1.16.0")
                  force("androidx.activity:activity:1.10.1")
                  force("androidx.activity:activity-ktx:1.10.1")
                  force("androidx.activity:activity-compose:1.10.1")
                  force("androidx.lifecycle:lifecycle-runtime:2.8.7")
                  force("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
                  force("androidx.lifecycle:lifecycle-runtime-compose-android:2.8.7")
                  force("androidx.lifecycle:lifecycle-viewmodel:2.8.7")
                  force("androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7")
                  force("androidx.lifecycle:lifecycle-viewmodel-compose-android:2.8.7")
              }
          }
          EOF
          APPROOT="app/src/main/java/com/alhamlawi/accounting/ui/AppRoot.kt"
          if [ -f "$APPROOT" ]; then
            sed -i '1i@file:OptIn(androidx.compose.material.ExperimentalMaterialApi::class, androidx.compose.material3.ExperimentalMaterial3Api::class)' "$APPROOT"
            head -n 3 "$APPROOT"
          fi
          tail -n 35 app/build.gradle.kts

      - name: Build debug APK
        working-directory: build-src/AlfaProAccounting-reviewed-source
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK="build-src/AlfaProAccounting-reviewed-source/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlfaProAccounting-debug-apk
          path: build-src/AlfaProAccounting-reviewed-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
